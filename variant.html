<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Sommargatan – VARIANT (WebXR på iPhone, spike)</title>

  <!--
    VARIANT LAUNCH-SPIKE: bringar äkta WebXR/ARKit 6DoF till iPhone via en
    separat App Clip-"viewer" (ej Safari själv). Self-hosted A-Frame funkar.
    Gratis Developer-tier: ~3k visningar/mån + vattenstämpel. Annars $99/mån.

    Nyckel: skaffa en gratis SDK-nyckel på https://launch.variant3d.com
    (dashboard → projekt → Launch Codes), öppna sedan:
        variant.html?key=DIN_NYCKEL
    Utan nyckel körs vanlig WebXR (funkar på Android, ej iOS Safari).

    SDK-taggen måste laddas så tidigt som möjligt → injiceras synkront här. -->
  <script>
    (function () {
      try {
        var k = new URLSearchParams(location.search).get('key');
        if (k) {
          document.write(
            '<scr' + 'ipt src="https://launchar.app/sdk/v1?key=' +
            encodeURIComponent(k) + '&redirect=true"><\/scr' + 'ipt>');
        }
      } catch (e) { /* ignorera */ }
    })();
  </script>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="css/ui.css">
  <style>
    html, body { margin: 0; overflow: hidden; background: #1a1a2e; }
    #start-screen {
      position: fixed; inset: 0; background: #1a1a2e; color: #fff;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 9999;
      padding: 32px; text-align: center; font-family: sans-serif;
    }
    #start-screen h2 { margin: 0; font-size: 1.4rem; }
    .method-badge {
      background: #2a7a6a; color: #fff; font-size: 0.8rem;
      padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px;
    }
    .method-desc { font-size: 0.85rem; color: #9999bb; max-width: 320px; line-height: 1.5; }
    .status-row {
      font-size: 0.95rem; padding: 9px 16px;
      background: rgba(255,255,255,0.08); border-radius: 8px; min-width: 240px;
    }
    .status-row.ready { color: #6dffb0; }
    .status-row.warn  { color: #ffdd57; }
    .status-row.error { color: #ff6b6b; }
    #start-btn {
      padding: 14px 40px; font-size: 1.1rem; font-weight: bold;
      border: none; border-radius: 12px; background: #2a7a6a; color: #fff;
      cursor: pointer; opacity: 0.45; pointer-events: none; transition: opacity 0.3s;
    }
    #start-btn.enabled { opacity: 1; pointer-events: all; }
    #back-link { color: #888; text-decoration: none; font-size: 0.85rem; }
    #key-note { font-size: 0.72rem; color: #c47d1a; max-width: 320px; line-height: 1.4; }
    #ui-overlay {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 10px 14px;
      pointer-events: none; z-index: 1000;
    }
    #ui-overlay button {
      pointer-events: all; padding: 8px 14px; border: none; border-radius: 8px;
      background: rgba(0,0,0,0.6); color: #fff; font-size: 0.85rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="start-screen">
    <span class="method-badge">VARIANT · WebXR på iPhone</span>
    <h2>Sommargatan AR</h2>
    <p class="method-desc">
      Spike: äkta 6DoF walk-around på iPhone via Variant Launch (App Clip-viewer).
      Sikta mot clownen och starta – kalibreras som kalasingången men med
      stabil ARKit-spårning.
    </p>
    <div id="load-status"  class="status-row warn">Laddar placements.csv...</div>
    <div id="xr-status"    class="status-row warn hidden">Kontrollerar WebXR...</div>
    <button id="start-btn">Starta AR</button>
    <div id="key-note"></div>
    <a href="test.html" id="back-link">&#8592; Tillbaka till testingång</a>
  </div>

  <div id="ui-overlay" class="hidden">
    <button id="exit-btn">&#10005; Avsluta</button>
  </div>

  <a-scene
    id="ar-scene"
    webxr="requiredFeatures: local; optionalFeatures: dom-overlay; domOverlay: #ui-overlay"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false">
    <a-assets id="asset-manager" timeout="30000"></a-assets>
    <a-entity id="scene-root"></a-entity>
    <a-camera></a-camera>
  </a-scene>

  <script>
    /*
     * VARIANT-spike: WebXR immersive-ar + clown-kalibrering (som kalasingången).
     * På Android funkar WebXR direkt. På iPhone tillhandahåller Variant Launchs
     * App Clip-viewer WebXR-API:t (kräver ?key=). Variant stödjer endast
     * reference space 'local' → requiredFeatures: local (ej local-floor).
     *
     * Origin = KALAS-ståpunkten; modeller offset därifrån; scenrotation =
     * kalas.bearing (WebXR förankrar −Z = blickriktning = mot clownen vid start).
     */
    var PATH_BEARING = 5.7010969;

    var anchor = null, kalas = null, placedObjects = [], modelDefaults = {};
    var csvReady = false, started = false;

    var loadStatus = document.getElementById('load-status');
    var xrStatus   = document.getElementById('xr-status');
    var startBtn   = document.getElementById('start-btn');
    var startScreen = document.getElementById('start-screen');
    var uiOverlay  = document.getElementById('ui-overlay');
    var keyNote    = document.getElementById('key-note');
    var scene      = document.getElementById('ar-scene');
    var assets     = document.getElementById('asset-manager');
    var sceneRoot  = document.getElementById('scene-root');

    var hasKey = !!new URLSearchParams(location.search).get('key');
    var isiOS  = /iPad|iPhone|iPod/.test(navigator.userAgent);

    /* Variant SDK signalerar om App Clip-launch krävs */
    window.addEventListener('vlaunch-initialized', function (e) {
      if (e.detail && e.detail.launchRequired) {
        keyNote.textContent = 'Öppnar Variant-viewern...';
        window.location.href = e.detail.launchUrl;
      }
    });

    function parseCSV(text) {
      var rows = [];
      text.trim().split(/\r?\n/).forEach(function (line) {
        line = line.trim();
        if (!line || line.charAt(0) === '#') return;
        var c = line.split(',').map(function (s) { return s.trim(); });
        var nam = c[0];
        if (nam.toLowerCase() === 'namn' || nam.toLowerCase() === 'name') return;
        if (nam.toUpperCase().startsWith('SPARR_') || nam.toLowerCase().endsWith('.png')) {
          if (nam.toUpperCase() !== 'KALAS') return;
        }
        var lat = parseFloat(c[1]), lon = parseFloat(c[2]);
        if (isNaN(lat) || isNaN(lon)) return;
        rows.push({ namn: nam, lat: lat, lon: lon, elev: val(c[3]),
          bearing: val(c[4]), csvScale: parseScale(c[5]) });
      });
      return rows;
    }
    function val(s) { return (s !== undefined && s !== '') ? parseFloat(s) : null; }
    function parseScale(s) {
      if (!s || s.trim() === '') return null; s = s.trim();
      return s.split(/\s+/).length === 1 ? s + ' ' + s + ' ' + s : s;
    }
    function surveyOffset(anc, lat, lon, elev) {
      var R = 6378137;
      var dLat = (lat - anc.lat) * Math.PI / 180, dLon = (lon - anc.lon) * Math.PI / 180;
      var midLat = ((lat + anc.lat) / 2) * Math.PI / 180;
      return { x: dLon * Math.cos(midLat) * R,
               y: (elev != null && anc.elev != null) ? (elev - anc.elev) : 0,
               z: -dLat * R };
    }
    function getScale(obj) {
      if (obj.csvScale) return obj.csvScale;
      if (modelDefaults[obj.namn] && modelDefaults[obj.namn].scale) return modelDefaults[obj.namn].scale;
      return '1 1 1';
    }
    function posStr(x, y, z) { return x.toFixed(3) + ' ' + y.toFixed(3) + ' ' + z.toFixed(3); }

    function buildScene() {
      placedObjects.forEach(function (obj, idx) {
        var off = obj.offset, assetId = 'v-asset-' + idx;
        var ai = document.createElement('a-asset-item');
        ai.setAttribute('id', assetId); ai.setAttribute('src', 'assets/models/' + obj.namn);
        assets.appendChild(ai);
        var m = document.createElement('a-gltf-model');
        m.setAttribute('src', '#' + assetId);
        m.setAttribute('position', posStr(off.x, off.y, off.z));
        m.setAttribute('scale', getScale(obj));
        sceneRoot.appendChild(m);
      });
    }

    Promise.all([
      fetch('config.json').then(function (r) { return r.ok ? r.json() : {}; }),
      fetch('assets/placements.csv').then(function (r) {
        if (!r.ok) throw new Error('placements.csv saknas'); return r.text();
      })
    ]).then(function (res) {
      modelDefaults = (res[0] && res[0].modelDefaults) || {};
      var rows = parseCSV(res[1]);
      anchor = rows.find(function (r) { return r.namn.toUpperCase() === 'ANKAR'; });
      if (!anchor) throw new Error('Ingen ANKAR-rad');
      var kalasRow = rows.find(function (r) { return r.namn.toUpperCase() === 'KALAS'; });
      kalas = kalasRow
        ? { lat: kalasRow.lat, lon: kalasRow.lon, bearing: kalasRow.bearing != null ? kalasRow.bearing : PATH_BEARING }
        : { lat: anchor.lat, lon: anchor.lon, bearing: PATH_BEARING };

      placedObjects = rows.filter(function (r) {
        return ['ANKAR', 'KALAS'].indexOf(r.namn.toUpperCase()) === -1 && !r.namn.toLowerCase().endsWith('.png');
      }).map(function (r) { r.offset = surveyOffset(anchor, r.lat, r.lon, r.elev); return r; });

      var staOff = surveyOffset(anchor, kalas.lat, kalas.lon, null);
      placedObjects.forEach(function (o) { o.offset.x -= staOff.x; o.offset.z -= staOff.z; });

      buildScene();
      loadStatus.textContent = placedObjects.length + ' modeller laddade ✓';
      loadStatus.className = 'status-row ready';
      csvReady = true;
      checkXR();
    }).catch(function (e) {
      loadStatus.textContent = 'Fel: ' + e.message; loadStatus.className = 'status-row error';
    });

    function checkXR() {
      xrStatus.classList.remove('hidden');
      if (isiOS && !hasKey) {
        keyNote.innerHTML = '⚠ iPhone kräver en gratis Variant-nyckel:<br>' +
          'öppna <b>variant.html?key=DIN_NYCKEL</b>';
      }
      if (!navigator.xr) {
        xrStatus.textContent = isiOS
          ? 'WebXR saknas – väntar på Variant-viewern (kräver ?key=)'
          : 'WebXR saknas i denna webbläsare';
        xrStatus.className = 'status-row warn';
        /* med nyckel injicerar Variant xr senare → aktivera knappen ändå */
        if (hasKey) startBtn.classList.add('enabled');
        return;
      }
      navigator.xr.isSessionSupported('immersive-ar').then(function (ok) {
        if (ok) { xrStatus.textContent = 'WebXR redo ✓'; xrStatus.className = 'status-row ready'; startBtn.classList.add('enabled'); }
        else { xrStatus.textContent = 'immersive-ar stöds ej'; xrStatus.className = 'status-row warn'; if (hasKey) startBtn.classList.add('enabled'); }
      });
    }

    startBtn.addEventListener('click', function () {
      if (!csvReady) return;
      scene.enterAR();
    });

    scene.addEventListener('enter-vr', function () {
      started = true;
      startScreen.classList.add('hidden');
      uiOverlay.classList.remove('hidden');
      /* WebXR-rymden förankrad mot blickriktning (mot clownen) vid start */
      sceneRoot.setAttribute('rotation', '0 ' + kalas.bearing.toFixed(2) + ' 0');
      sceneRoot.setAttribute('position', '0 0 0');
    });
    scene.addEventListener('exit-vr', function () { window.location.href = 'test.html'; });
    document.getElementById('exit-btn').addEventListener('click', function () { scene.exitVR(); });
  </script>
</body>
</html>
