<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Sommargatan Survey AR v007</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="css/ui.css">
  <style>
    html, body { margin: 0; overflow: hidden; background: #000; }

    #start-screen {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 9999;
      padding: 32px;
      text-align: center;
      font-family: sans-serif;
    }
    #start-screen h2 { margin: 0; font-size: 1.4rem; }

    .status-row {
      font-size: 1rem;
      padding: 10px 18px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      min-width: 260px;
    }
    .status-row.ready  { color: #6dffb0; }
    .status-row.warn   { color: #ffdd57; }
    .status-row.error  { color: #ff6b6b; }

    #start-ar-btn {
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #2a6b4a;
      color: #fff;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #start-ar-btn.enabled { opacity: 1; pointer-events: all; }
    #back-start { color: #aaa; text-decoration: none; font-size: 0.9rem; }

    #ui-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 16px;
      pointer-events: none;
      z-index: 1000;
    }
    #ui-overlay button {
      pointer-events: all;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #acc-label {
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 6px;
    }

    #error-overlay {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      padding: 32px;
      text-align: center;
      font-family: sans-serif;
    }
    #error-overlay h2 { color: #ff6b6b; margin: 0; }
    #error-overlay a  { color: #aaa; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── Startskärm ── -->
  <div id="start-screen">
    <h2>Sommargatan Survey AR</h2>
    <div id="load-status"  class="status-row warn">Laddar placements.csv...</div>
    <div id="gps-status"   class="status-row warn hidden">Söker GPS...</div>
    <div id="anchor-dist"  class="status-row hidden"></div>
    <button id="start-ar-btn">Starta AR</button>
    <a href="index.html" id="back-start">&#8592; Tillbaka</a>
  </div>

  <!-- ── Felskärm ── -->
  <div id="error-overlay" class="hidden">
    <h2>Fel</h2>
    <p id="error-message"></p>
    <a href="index.html">&#8592; Gå tillbaka</a>
  </div>

  <!-- ── DOM overlay (visas inuti AR-sessionen) ── -->
  <div id="ui-overlay" class="hidden">
    <button id="exit-ar-btn">&#10005; Avsluta AR</button>
    <div id="acc-label"></div>
  </div>

  <!-- ── A-Frame-scen ── -->
  <a-scene
    id="ar-scene"
    webxr="requiredFeatures: local-floor; optionalFeatures: dom-overlay; domOverlay: #ui-overlay"
    renderer="antialias: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets id="asset-manager" timeout="30000"></a-assets>
    <a-camera></a-camera>
  </a-scene>

  <script>
    /* ─────────────────────────────────────────
       Konfiguration
    ───────────────────────────────────────── */
    var MAX_GPS_ACC       = 15;   // m — acceptera GPS-mätningar upp till ±15 m
    var VISIBILITY_HZ     = 100;  // ms mellan synlighetskontroller under AR

    /* ─────────────────────────────────────────
       Tillstånd
    ───────────────────────────────────────── */
    var anchor        = null;  // ANKAR-raden
    var placedObjects = [];    // GLB-objekt med offset + synlighetsregler
    var barriers      = [];    // siktbarriärer [{ ax, az, bx, bz }]
    var modelDefaults = {};
    var lastGoodPos   = null;
    var lastAcc       = null;
    var visTimer      = null;

    /* ─────────────────────────────────────────
       DOM-refs
    ───────────────────────────────────────── */
    var startScreen  = document.getElementById('start-screen');
    var errorOverlay = document.getElementById('error-overlay');
    var uiOverlay    = document.getElementById('ui-overlay');
    var loadStatus   = document.getElementById('load-status');
    var gpsStatus    = document.getElementById('gps-status');
    var anchorDist   = document.getElementById('anchor-dist');
    var startBtn     = document.getElementById('start-ar-btn');
    var exitBtn      = document.getElementById('exit-ar-btn');
    var accLabel     = document.getElementById('acc-label');
    var scene        = document.getElementById('ar-scene');
    var assets       = document.getElementById('asset-manager');

    /* ─────────────────────────────────────────
       CSV-parser
       Stödjer: header-rad, kommentarsrader (#),
       valfria kolumner elev + synlig_inom.
       Identifierar ANKAR och SPARR_*_A/B automatiskt.
    ───────────────────────────────────────── */
    function parseCSV(text) {
      var objectRows = [];
      var sparrRows  = [];

      text.trim().split(/\r?\n/).forEach(function (line) {
        line = line.trim();
        if (!line || line.charAt(0) === '#') return;
        var c   = line.split(',').map(function (s) { return s.trim(); });
        var nam = c[0];
        if (nam.toLowerCase() === 'namn' || nam.toLowerCase() === 'name') return;

        var lat = parseFloat(c[1]);
        var lon = parseFloat(c[2]);
        if (isNaN(lat) || isNaN(lon)) return;

        var row = {
          namn:        nam,
          lat:         lat,
          lon:         lon,
          elev:        (c[3] !== undefined && c[3] !== '') ? parseFloat(c[3]) : null,
          synligInom:  (c[4] !== undefined && c[4] !== '') ? parseFloat(c[4]) : null
        };

        var sparrMatch = nam.match(/^SPARR_(.+)_(A|B)$/i);
        if (sparrMatch) {
          row.sparrGroup    = sparrMatch[1];
          row.sparrEndpoint = sparrMatch[2].toUpperCase();
          sparrRows.push(row);
        } else {
          objectRows.push(row);
        }
      });

      return { objectRows: objectRows, sparrRows: sparrRows };
    }

    /* ─────────────────────────────────────────
       Geodetisk offset ankar → punkt (meter)
       +X = öst, +Y = upp, -Z = norr (A-Frame)
    ───────────────────────────────────────── */
    function surveyOffset(anc, obj) {
      var R    = 6378137;
      var dLat = (obj.lat - anc.lat) * Math.PI / 180;
      var dLon = (obj.lon - anc.lon) * Math.PI / 180;
      var midLat = ((obj.lat + anc.lat) / 2) * Math.PI / 180;
      return {
        x: dLon * Math.cos(midLat) * R,
        y: (obj.elev != null && anc.elev != null) ? (obj.elev - anc.elev) : 0,
        z: -dLat * R
      };
    }

    /* ─────────────────────────────────────────
       Avstånd (horisontellt) från lat/lon till ankaret
    ───────────────────────────────────────── */
    function distToAnchor(lat, lon) {
      if (!anchor) return null;
      var off = surveyOffset(anchor, { lat: lat, lon: lon, elev: anchor.elev });
      return Math.sqrt(off.x * off.x + off.z * off.z);
    }

    /* ─────────────────────────────────────────
       Bygg barriärlista från SPARR-rader
    ───────────────────────────────────────── */
    function buildBarriers(sparrRows) {
      var groups = {};
      sparrRows.forEach(function (row) {
        var off = surveyOffset(anchor, row);
        if (!groups[row.sparrGroup]) groups[row.sparrGroup] = {};
        groups[row.sparrGroup][row.sparrEndpoint] = { x: off.x, z: off.z };
      });
      var result = [];
      Object.keys(groups).forEach(function (name) {
        var g = groups[name];
        if (g.A && g.B) {
          result.push({ ax: g.A.x, az: g.A.z, bx: g.B.x, bz: g.B.z });
        } else {
          console.warn('SPARR_' + name + ' saknar ett A- eller B-par, ignoreras.');
        }
      });
      return result;
    }

    /* ─────────────────────────────────────────
       2D linjeskärningstest (horisontellt plan)
       Returnerar true om segment P1→P2 skär P3→P4
    ───────────────────────────────────────── */
    function segmentsIntersect(p1x, p1z, p2x, p2z, p3x, p3z, p4x, p4z) {
      var d1x = p2x - p1x, d1z = p2z - p1z;
      var d2x = p4x - p3x, d2z = p4z - p3z;
      var cross = d1x * d2z - d1z * d2x;
      if (Math.abs(cross) < 1e-10) return false; // parallella
      var dx = p3x - p1x, dz = p3z - p1z;
      var t = (dx * d2z - dz * d2x) / cross;
      var u = (dx * d1z - dz * d1x) / cross;
      return t > 0 && t < 1 && u > 0 && u < 1;
    }

    /* ─────────────────────────────────────────
       Skalstring för en modell
    ───────────────────────────────────────── */
    function getScale(filename) {
      return (modelDefaults[filename] && modelDefaults[filename].scale)
        ? modelDefaults[filename].scale : '1 1 1';
    }

    function posStr(x, y, z) {
      return x.toFixed(3) + ' ' + y.toFixed(3) + ' ' + z.toFixed(3);
    }

    /* ─────────────────────────────────────────
       Bygg A-Frame-entiteter (osynliga till AR startar)
    ───────────────────────────────────────── */
    function buildScene() {
      placedObjects.forEach(function (obj, idx) {
        var off      = obj.offset;
        var assetId  = 'survey-asset-' + idx;
        var scaleStr = getScale(obj.namn);

        var assetItem = document.createElement('a-asset-item');
        assetItem.setAttribute('id',  assetId);
        assetItem.setAttribute('src', 'assets/models/' + obj.namn);
        assets.appendChild(assetItem);

        // Platshållarkub
        var box = document.createElement('a-box');
        box.setAttribute('id',       'box-' + idx);
        box.setAttribute('color',    '#4a90d9');
        box.setAttribute('opacity',  '0.85');
        box.setAttribute('position', posStr(off.x, off.y + 0.5, off.z));
        box.setAttribute('visible',  'false');
        scene.appendChild(box);

        // GLB-modell
        var model = document.createElement('a-gltf-model');
        model.setAttribute('id',       'model-' + idx);
        model.setAttribute('src',      '#' + assetId);
        model.setAttribute('position', posStr(off.x, off.y, off.z));
        model.setAttribute('scale',    scaleStr);
        model.setAttribute('visible',  'false');

        model.addEventListener('model-loaded', function () {
          obj.modelLoaded = true;
          // Om AR redan kör och objektet är synligt – visa modell, dölj box
          if (obj.arActive && obj.currentlyVisible) {
            box.setAttribute('visible',   'false');
            model.setAttribute('visible', 'true');
          }
        });

        scene.appendChild(model);

        obj.modelLoaded      = false;
        obj.arActive         = false;
        obj.currentlyVisible = false;
      });
    }

    /* ─────────────────────────────────────────
       Synlighetskontroll – körs var VISIBILITY_HZ ms
    ───────────────────────────────────────── */
    function updateVisibility() {
      var threeCamera = scene.camera;
      if (!threeCamera) return;

      var camPos = new THREE.Vector3();
      threeCamera.getWorldPosition(camPos);

      placedObjects.forEach(function (obj, idx) {
        var shouldShow = checkVisible(camPos, obj);
        if (shouldShow === obj.currentlyVisible) return; // ingen förändring
        obj.currentlyVisible = shouldShow;
        applyVisibility(idx, obj, shouldShow);
      });
    }

    function checkVisible(camPos, obj) {
      var off = obj.offset;

      // 1. Distansgräns
      if (obj.synligInom !== null) {
        var dx   = camPos.x - off.x;
        var dz   = camPos.z - off.z;
        var dist = Math.sqrt(dx * dx + dz * dz);
        if (dist > obj.synligInom) return false;
      }

      // 2. Siktbarriärer
      for (var i = 0; i < barriers.length; i++) {
        var b = barriers[i];
        if (segmentsIntersect(
          camPos.x, camPos.z, off.x, off.z,
          b.ax, b.az, b.bx, b.bz
        )) return false;
      }

      return true;
    }

    function applyVisibility(idx, obj, show) {
      var model = document.getElementById('model-' + idx);
      var box   = document.getElementById('box-'   + idx);
      if (show) {
        if (obj.modelLoaded) {
          model.setAttribute('visible', 'true');
          box.setAttribute('visible',   'false');
        } else {
          box.setAttribute('visible',   'true');
        }
      } else {
        model.setAttribute('visible', 'false');
        box.setAttribute('visible',   'false');
      }
    }

    /* ─────────────────────────────────────────
       Laddning: config.json + placements.csv
    ───────────────────────────────────────── */
    Promise.all([
      fetch('config.json').then(function (r) {
        if (!r.ok) throw new Error('config.json saknas');
        return r.json();
      }),
      fetch('assets/placements.csv').then(function (r) {
        if (!r.ok) throw new Error('assets/placements.csv saknas (HTTP ' + r.status + ')');
        return r.text();
      })
    ]).then(function (results) {
      var config  = results[0];
      var csvText = results[1];

      modelDefaults = config.modelDefaults || {};

      var parsed = parseCSV(csvText);
      anchor = parsed.objectRows.find(function (r) {
        return r.namn.toUpperCase() === 'ANKAR';
      });

      if (!anchor) {
        showError('Ingen ANKAR-rad hittades i placements.csv.');
        return;
      }

      placedObjects = parsed.objectRows
        .filter(function (r) { return r.namn.toUpperCase() !== 'ANKAR'; })
        .map(function (r) {
          r.offset = surveyOffset(anchor, r);
          return r;
        });

      barriers = buildBarriers(parsed.sparrRows);

      var info = placedObjects.length + ' objekt';
      if (barriers.length > 0) info += ', ' + barriers.length + ' barriär' + (barriers.length > 1 ? 'er' : '');
      loadStatus.textContent = info + ' laddade ✓';
      loadStatus.className   = 'status-row ready';

      buildScene();
      checkWebXR();

    }).catch(function (err) {
      showError('Laddningsfel: ' + err.message);
    });

    /* ─────────────────────────────────────────
       WebXR-stödskontroll
    ───────────────────────────────────────── */
    function checkWebXR() {
      if (!navigator.xr) {
        showError('Webbläsaren saknar WebXR. Prova Chrome på Android.');
        return;
      }
      navigator.xr.isSessionSupported('immersive-ar').then(function (ok) {
        if (!ok) {
          showError('WebXR AR (ARCore) stöds inte. Krävs: Chrome + Android med ARCore installerat.');
        } else {
          gpsStatus.classList.remove('hidden');
          startGPS();
        }
      });
    }

    /* ─────────────────────────────────────────
       GPS-bevakning
    ───────────────────────────────────────── */
    function startGPS() {
      if (!navigator.geolocation) {
        showError('Enheten saknar GPS.');
        return;
      }
      navigator.geolocation.watchPosition(
        function (pos) {
          var acc = Math.round(pos.coords.accuracy);
          lastAcc = acc;

          if (acc <= MAX_GPS_ACC) {
            lastGoodPos = pos.coords;
            gpsStatus.textContent = 'GPS ±' + acc + ' m ✓';
            gpsStatus.className   = 'status-row ready';
            startBtn.classList.add('enabled');
          } else {
            gpsStatus.textContent = 'GPS söker... ±' + acc + ' m';
            gpsStatus.className   = 'status-row warn';
          }

          if (anchor) {
            var d = distToAnchor(pos.coords.latitude, pos.coords.longitude);
            anchorDist.classList.remove('hidden');
            anchorDist.textContent = 'Avstånd till ankare: ' + Math.round(d) + ' m';
            anchorDist.className   = 'status-row ' +
              (d < 10 ? 'ready' : d < 50 ? 'warn' : 'error');
          }
        },
        function () {
          showError('GPS nekades. Tillåt platsdelning i Chrome-inställningarna.');
        },
        { enableHighAccuracy: true }
      );
    }

    /* ─────────────────────────────────────────
       Knappar
    ───────────────────────────────────────── */
    startBtn.addEventListener('click', function () {
      if (!lastGoodPos) return;
      scene.enterAR();
    });

    exitBtn.addEventListener('click', function () {
      scene.exitVR();
    });

    /* ─────────────────────────────────────────
       AR-sessionshändelser
    ───────────────────────────────────────── */
    scene.addEventListener('enter-vr', function () {
      startScreen.style.display = 'none';
      uiOverlay.classList.remove('hidden');
      if (lastAcc !== null) accLabel.textContent = 'GPS ±' + lastAcc + ' m';

      // Markera alla objekt som AR-aktiva och starta synlighetsslingan
      placedObjects.forEach(function (obj) { obj.arActive = true; });
      visTimer = setInterval(updateVisibility, VISIBILITY_HZ);
    });

    scene.addEventListener('exit-vr', function () {
      clearInterval(visTimer);
      window.location.href = 'index.html';
    });

    /* ─────────────────────────────────────────
       Felvisning
    ───────────────────────────────────────── */
    function showError(msg) {
      startScreen.classList.add('hidden');
      document.getElementById('error-message').textContent = msg;
      errorOverlay.classList.remove('hidden');
    }
  </script>

</body>
</html>
